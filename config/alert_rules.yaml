alerts:
  - name: HighLatency
    severity: warning
    condition: p95_latency_ms > 3000
    duration: 5m
    type: symptom-based
    channel: slack-alerts
    owner: SRE Team
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: slack-alerts
    owner: SRE Team
    runbook: docs/alerts.md#alert-2
  - name: HighCost
    severity: warning
    condition: total_cost_usd > 2.5
    duration: 5m
    type: symptom-based
    channel: slack-alerts
    owner: FinOps Team
    runbook: docs/alerts.md#alert-3
